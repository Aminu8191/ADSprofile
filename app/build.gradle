plugins {
    id 'com.android.application'
}

android {
    namespace 'com.adsprofile.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.adsprofile.app"
        minSdk 23
        targetSdk 34
        versionCode 4
        versionName "2.1.0"
        // AdMob APP ID. This one is Google's official TEST id. Replace with your real one later.
        manifestPlaceholders = [admobAppId: "ca-app-pub-3940256099942544~3347511713"]
    }

    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_FILE")) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("KEYSTORE_FILE") ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:23.1.0'
}
